name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz
            bin_name: phalanx-daemon

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz
            bin_name: phalanx-daemon

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_ext: tar.gz
            bin_name: phalanx-daemon

          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            archive_ext: tar.gz
            bin_name: phalanx-daemon

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_ext: zip
            bin_name: phalanx-daemon.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-rs (for musl & cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross.git --rev 0.2.5

      - name: Build release binary
        shell: bash
        env:
          RUSTFLAGS: "-C strip=symbols -C opt-level=3 -C codegen-units=1"
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p phalanx-daemon
          else
            cargo build --release --target ${{ matrix.target }} -p phalanx-daemon
          fi

      - name: Package artifacts (POSIX tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="phalanx-daemon-${TAG}-${{ matrix.target }}.tar.gz"
          TARGET_DIR="target/${{ matrix.target }}/release"
          
          cp "${TARGET_DIR}/${{ matrix.bin_name }}" ./phalanx-daemon
          ln -sf phalanx-daemon ./phalanx
          
          tar -czf "${ARCHIVE_NAME}" phalanx-daemon phalanx
          
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi
          
          echo "ASSET_FILE=${ARCHIVE_NAME}" >> $GITHUB_ENV
          echo "CHECKSUM_FILE=${ARCHIVE_NAME}.sha256" >> $GITHUB_ENV

      - name: Package artifacts (Windows zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $Tag = "${env:GITHUB_REF_NAME}"
          $ArchiveName = "phalanx-daemon-$Tag-${{ matrix.target }}.zip"
          $BinPath = "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          
          Copy-Item $BinPath -Destination "./phalanx-daemon.exe"
          Copy-Item "./phalanx-daemon.exe" -Destination "./phalanx.exe"
          
          Compress-Archive -Path "./phalanx-daemon.exe", "./phalanx.exe" -DestinationPath $ArchiveName -Force
          
          $Hash = (Get-FileHash -Path $ArchiveName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $ArchiveName" | Out-File -Encoding ascii "$ArchiveName.sha256"
          
          echo "ASSET_FILE=$ArchiveName" >> $env:GITHUB_ENV
          echo "CHECKSUM_FILE=$ArchiveName.sha256" >> $env:GITHUB_ENV

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_FILE }}
            ${{ env.CHECKSUM_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}