[package]
name = "phalanx-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
phalanx-core = { workspace = true }
alloy-primitives = { workspace = true, features = ["serde"] }
revm = { workspace = true }
axum = { version = "0.7", features = ["tokio", "http1", "http2"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
moka = { version = "0.12", features = ["sync", "future"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = { workspace = true }
futures = "0.3"

[[bin]]
name = "phalanx-daemon"
path = "src/main.rs"

[[test]]
name = "phase1_bench"
path = "tests/phase1_bench.rs"

[[test]]
name = "phase2_sectors_bench"
path = "tests/phase2_sectors_bench.rs"

[[test]]
name = "phase2_production_stress_bench"
path = "tests/phase2_production_stress_bench.rs"